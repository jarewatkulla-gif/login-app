<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สไลด์โชว์ภาพ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700;800&family=Sarabun:wght@400;500;800&family=Prompt:wght@400;500;800&family=Kanit:wght@400;500;800&family=Mitr:wght@400;500&family=Pridi:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#1b2430;--muted:#5d6877;--line:#d5dae1;--accent:#1f5fbf;--accent-ink:#fff;--stage:#0d1117;--danger:#b3261e;box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1a2029;--ink:#e8ecf1;--muted:#9aa5b4;--line:#2d3643;--accent:#6ea2f0;--accent-ink:#0d1117;--stage:#000;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1a2029;--ink:#e8ecf1;--muted:#9aa5b4;--line:#2d3643;--accent:#6ea2f0;--accent-ink:#0d1117;--stage:#000;--danger:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.6}
.app{display:grid;grid-template-columns:360px 1fr;gap:16px;max-width:1320px;margin:0 auto;padding:16px}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
h1{font-size:20px;margin:0 0 2px}h2,summary{font-size:15px;margin:0 0 10px;font-weight:700}
summary{cursor:pointer;margin:0}details[open] summary{margin-bottom:10px}
.sub{margin:0;color:var(--muted);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:20px 12px;text-align:center;cursor:pointer;color:var(--muted);transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);outline:none}
.drop strong{display:block;color:var(--ink);font-size:15px}
.field{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;margin-bottom:12px}
.field label{font-size:14px}.val{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.field input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.hint{grid-column:1/-1;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two label{font-size:12px;color:var(--muted);display:block}
button,select,input[type=number],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
select,input[type=number],textarea{width:100%;background:var(--bg);padding:7px 8px}
textarea{resize:vertical;min-height:80px;margin-top:8px}
button{cursor:pointer}button:hover{border-color:var(--accent)}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled,textarea:disabled,input:disabled{opacity:.45;cursor:not-allowed}.danger{color:var(--danger)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;max-height:300px;overflow:auto}
.thumb{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;border:2px solid transparent;background:var(--bg);cursor:grab}
.thumb.cur{border-color:var(--accent)}.thumb.dragover{outline:2px dashed var(--accent)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;line-height:1;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:0}
.thumb .n{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.65);color:#fff;border-radius:4px;font-size:11px;padding:0 5px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:8px}
.tracks{font-size:13px;max-height:110px;overflow:auto}.tracks div{padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tracks .cur{background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:700}
main{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage{position:relative;background:var(--stage);border-radius:10px;aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
.stage .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity var(--fade,1s) ease-in-out}
.stage .layer.on{opacity:1}
.placeholder{color:#8b95a3;text-align:center;padding:20px}
.bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);width:0;z-index:3}
.cap{position:absolute;left:0;right:0;bottom:4px;padding:28px 5% 14px;text-align:center;color:#fff;font-size:clamp(15px,2.2vw,26px);line-height:1.5;background:linear-gradient(to top,rgba(0,0,0,.75),rgba(0,0,0,0));text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:2;pointer-events:none;white-space:pre-wrap}
.cap:empty{display:none}.stage:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}.stage:fullscreen .cap{font-size:clamp(20px,3vw,40px)}.stage:fullscreen.idle{cursor:none}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{margin-left:auto;font-size:13px;color:var(--muted)}
#pvBox video{width:100%;border-radius:10px;background:#000;max-height:70vh}
#exp{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#exp[hidden],#pvBox[hidden]{display:none}
#exp .box{background:var(--panel);border-radius:12px;padding:20px;max-width:420px;width:100%}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:12px 0}.prog div{height:100%;width:0;background:var(--accent)}
@media (max-width:900px){.app{grid-template-columns:1fr}main{order:-1}}
@media (prefers-reduced-motion:reduce){.stage .layer{transition-duration:.01s!important}}
.app{grid-template-columns:minmax(0,1fr) 340px}
.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:0 0 8px;display:flex;flex-direction:column;gap:8px}
.stage{width:min(100%,calc(52vh*16/9));margin:0 auto}
.stage .layer{transition:none;z-index:0}
.bar{z-index:6}
.cap{position:absolute;left:50%;top:88%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:max-content;max-width:84%;padding:.35em .8em;border-radius:.4em;background:rgba(0,0,0,.55);color:#fff;font-size:var(--cs,18px);font-weight:600;line-height:1.45;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.6);z-index:5;pointer-events:auto;cursor:move;touch-action:none;user-select:none;white-space:pre-wrap;overflow-wrap:anywhere}
.stage:fullscreen .cap{font-size:var(--cs,18px)}
.cap .rd{text-decoration:underline;text-decoration-thickness:.12em;text-underline-offset:.2em;color:#ffe08a}
@media (max-width:900px){.app{grid-template-columns:1fr}}
.sticky{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 16px;border-bottom:1px solid var(--line);align-items:center}
.sticky .ctrl{width:min(100%,1288px)}
.stage{width:min(100%,calc(44vh*16/9))}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.app{padding-top:12px}
.cap{font-size:18px}
.cap .ci{display:block}
.cap .hid{visibility:hidden}
.cap .in{animation:cin .4s ease-out}
@keyframes cin{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
.cap.fx-credit{left:50%!important;top:50%!important;height:82%;width:62%;max-width:84%;overflow:hidden;background:transparent!important;padding:0;pointer-events:none}
.cap.fx-credit .ci{position:absolute;left:0;right:0;top:100%;padding:0 .5em;animation:ccr var(--cd,10s) linear forwards}
@keyframes ccr{from{top:100%;transform:none}to{top:0;transform:translateY(-100%)}}
.cap.fx-banner{left:0!important;transform:translate(0,-50%);width:100%;max-width:100%;border-radius:0;overflow:hidden;white-space:nowrap;padding-left:0;padding-right:0;pointer-events:none}
.cap.fx-banner .ci{display:inline-block;padding-left:100%;white-space:nowrap;animation:cbn var(--cd,10s) linear forwards}
@keyframes cbn{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.cap.fx-lower{left:0!important;transform:translate(0,-50%);border-left:.35em solid #ffd166;border-radius:0 .4em .4em 0;animation:clw .6s ease-out}
@keyframes clw{from{transform:translate(-110%,-50%)}to{transform:translate(0,-50%)}}
.cap.fx-border{border:.16em solid #ffd166;border-radius:.5em;animation:cbd 2s ease-in-out infinite alternate}
@keyframes cbd{from{box-shadow:0 0 .3em rgba(255,209,102,.4)}to{box-shadow:0 0 1em rgba(255,209,102,.9)}}
.cap.fx-pop .ci{animation:cpo .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cpo{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.cap.static,.cap.static .ci{animation:none!important}
.cap.static.fx-credit{height:auto;overflow:visible}
.cap.static.fx-credit .ci{position:static}
.cap.static.fx-banner{left:50%!important;transform:translate(-50%,-50%);width:max-content;max-width:84%;white-space:pre-wrap;overflow:visible}
.cap.static.fx-banner .ci{padding-left:0;white-space:pre-wrap;display:block}
.cap.static.fx-lower{left:50%!important;transform:translate(-50%,-50%)}
.fshint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:4px 12px;border-radius:6px;font-size:13px;z-index:7;display:none;pointer-events:none}
.fshint.show{display:block}
.grp{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.grp>summary{margin:0 0 6px;font-size:14px}
.tg{min-width:38px;padding:6px 10px}
.tg.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=color]{width:100%;height:34px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.thumb .ck{position:absolute;top:3px;left:3px;width:18px;height:18px;margin:0;z-index:2;accent-color:var(--accent)}
.thumb.off img,.thumb.off video{opacity:.35}
.cin{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:6px}
</style>
</head>
<body>
  <div class="sticky">
    <div class="stage" id="stage">
      <div class="placeholder" id="ph" data-k="ph"></div>
      <img class="layer" id="a" alt=""><img class="layer" id="b" alt="">
      <video class="layer" id="va" playsinline preload="auto"></video><video class="layer" id="vb" playsinline preload="auto"></video>
      <canvas id="ov" width="1280" height="720"></canvas><div class="cap" id="cap" aria-live="polite"></div><div class="fshint" id="fshint" data-k="fshint"></div><div class="bar" id="bar"></div>
    </div>
    <div class="ctrl">
      <button id="prev" disabled data-k="prev"></button><button id="play" class="primary" disabled></button><button id="next" disabled data-k="next"></button><button id="fs" disabled data-k="fs"></button><button id="revBtn" disabled data-k="revBtn"></button>
      <button id="addBtn" data-k="addBtn"></button><button id="openVid" data-k="openV"></button><input id="vfile" type="file" accept="video/*,.mp4,.webm,.kai,.zip" hidden>
      <span class="status" id="status"></span>
    </div>
  </div>
<div class="app">
<main>
  <div class="card" id="edCard">
    <h2 data-k="secEdit"></h2>
    <p class="sub" id="edFor"></p>
    <div class="row" style="margin:8px 0"><button id="mvL" disabled data-k="moveL"></button><button id="mvR" disabled data-k="moveR"></button></div>
    <details class="grp" open><summary data-k="grpText"></summary>
      <label class="sub" for="capLang" data-k="capLang"></label>
      <select id="capLang" class="ed" disabled></select>
      <textarea id="capText" class="ed" rows="3" data-ph="capPh" disabled></textarea>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="showCap" checked><span data-k="showCap"></span></label>
      <p class="sub" data-k="capPos"></p>
      <div class="row" style="margin:6px 0 4px"><button id="pTop" class="ed" disabled data-k="posTop"></button><button id="pMid" class="ed" disabled data-k="posMid"></button><button id="pBot" class="ed" disabled data-k="posBot"></button><button id="pRst" class="ed" disabled data-k="posReset"></button></div>
    </details>
    <details class="grp"><summary data-k="grpStyle"></summary>
      <div class="two">
        <div><label for="stFf" data-k="stFf"></label><select id="stFf" class="ed" disabled></select></div>
        <div><label for="stFs" data-k="stFs"></label><input id="stFs" class="ed" type="number" min="8" max="160" step="1" disabled></div>
        <div><label for="stCol" data-k="stCol"></label><input id="stCol" class="ed" type="color" disabled></div>
        <div><label for="stSc" data-k="stSc"></label><input id="stSc" class="ed" type="color" disabled></div>
        <div><label for="stSw" data-k="stSw"></label><input id="stSw" class="ed" type="number" min="0" max="20" step="0.5" disabled></div>
      </div>
      <div class="row" style="margin:8px 0"><button id="stB" class="ed tg" disabled><b>B</b></button><button id="stI" class="ed tg" disabled><i>I</i></button><button id="stU" class="ed tg" disabled><u>U</u></button>
        <button id="aL" class="ed tg" disabled data-k="aL"></button><button id="aC" class="ed tg" disabled data-k="aC"></button><button id="aR" class="ed tg" disabled data-k="aR"></button></div>
      <label class="chk"><input type="checkbox" id="stBg" class="ed" disabled><span data-k="stBg"></span></label>
      <button id="stAll" class="ed" disabled data-k="stAll"></button>
    </details>
    <details class="grp"><summary data-k="grpFx"></summary>
      <label class="sub" for="capfx" data-k="capfx"></label><select id="capfx" class="ed" disabled></select>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="capAuto" class="ed" checked disabled><span data-k="capAuto"></span></label>
      <p class="sub" data-k="capAutoHint"></p>
      <button id="fxPrev" class="ed" disabled data-k="fxPrev" style="margin-top:6px"></button>
    </details>
    <details class="grp" open><summary data-k="grpVoice"></summary>
      <label class="sub" for="vt" data-k="vtL"></label><select id="vt" class="ed" disabled></select>
      <label class="sub" for="rl" data-k="rlL" style="display:block;margin-top:8px"></label><select id="rl" class="ed" disabled></select>
      <label class="sub" for="vn" data-k="vnL" style="display:block;margin-top:8px"></label><select id="vn" class="ed" disabled></select>
      <p class="sub" id="vnHint"></p>
      <div class="row" style="margin-top:6px"><button id="vtPrev" class="ed" disabled data-k="vtPrev"></button><button id="vtAll" class="ed" disabled data-k="vtAll"></button></div>
      <label class="chk" style="margin-top:8px"><input type="checkbox" id="ocr" class="ed" disabled><span data-k="ocr"></span></label>
      <p class="sub" data-k="ocrHint"></p>
      <button id="ocrTry" class="ed" disabled data-k="ocrTry" style="margin-top:6px"></button>
      <p class="sub" id="ocrOut"></p>
    </details>
    <details class="grp" open><summary data-k="grpMedia"></summary>
      <div class="two">
        <div><label for="fxItem" data-k="fxItem"></label><select id="fxItem" class="ed" disabled></select></div>
        <div><label for="fltItem" data-k="fltItem"></label><select id="fltItem" class="ed" disabled></select></div>
        <div><label for="ovlItem" data-k="ovlItem"></label><select id="ovlItem" class="ed" disabled></select></div>
        <div><label for="frmItem" data-k="frmItem"></label><select id="frmItem" class="ed" disabled></select></div>
        <div><label for="pDur" data-k="pDur"></label><input id="pDur" class="ed" type="number" min="0.5" step="0.5" disabled></div>
        <div><label for="pFade" data-k="pFade"></label><input id="pFade" class="ed" type="number" min="0" max="10" step="0.1" disabled></div>
      </div>
      <p class="sub" style="margin-top:4px" data-k="mainHint"></p>
    </details>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0"><span data-k="secList"></span> (<span id="count">0</span>)</h2><button id="clear" class="danger" data-k="clearAll" disabled></button></div>
    <div class="row" style="margin-bottom:6px"><button id="selAll" data-k="selAll"></button><button id="selNone" data-k="selNone"></button>
      <label class="sub" for="ordNum" data-k="ordTo"></label><input id="ordNum" type="number" min="1" style="width:72px"><button id="ordGo" data-k="ordGo"></button></div>
    <label class="chk"><input type="checkbox" id="promo"><span data-k="promo"></span></label>
    <p class="sub" id="selInfo"></p>
    <div class="list" id="list"></div>
  </div>
  <section class="card" id="pvBox" hidden>
    <h2 data-k="expDone"></h2><video id="pv" controls playsinline></video>
    <div class="row" style="margin-top:8px"><button id="pvSave" class="primary" data-k="saveVid"></button><button id="pvClose" data-k="closeV"></button><span class="sub" id="pvName"></span></div>
  </section>
</main>
<aside>
  <div class="card">
    <h1 data-k="title"></h1><p class="sub" data-k="sub"></p>
    <div style="margin-top:10px"><label class="sub" for="ui" data-k="uiLang"></label>
    <select id="ui"><option value="0">ไทย</option><option value="1">English</option><option value="2">中文</option></select></div>
  </div>
  <div class="card">
    <div class="drop" id="drop" tabindex="0" role="button"><strong data-k="drop"></strong><span data-k="dropSub"></span></div>
    <input id="file" type="file" accept="image/*,video/*,.mp4,.mov,.m4v,.webm,.zip" multiple hidden>
  </div>
  <div class="card">
    <h2 data-k="secDir"></h2>
    <button id="pickDir" data-k="pickDir"></button>
    <p class="sub" id="dirInfo" style="margin-top:6px"></p>
    <p class="sub" id="userInfo"></p>
  </div>
  <div class="card">
    <h2 data-k="secProj"></h2>
    <div class="row"><button id="save" data-k="save" disabled></button><button id="load" data-k="load"></button><button id="export" class="primary" data-k="exportBtn" disabled></button></div>
    <input id="zip" type="file" accept=".zip,application/zip" hidden>
    <label class="chk" style="margin-top:8px"><input type="checkbox" id="encKai" checked><span data-k="encKai"></span></label>
    <label class="chk"><input type="checkbox" id="narr" checked><span data-k="narr"></span></label>
    <p class="sub" style="margin-top:8px" data-k="projHint"></p>
  </div>
  <div class="card">
    <h2 data-k="secTime"></h2>
    <div class="field"><label for="dur" data-k="dur"></label><span class="val" id="durV"></span>
      <input id="dur" type="range" min="1" max="60" step="0.5" value="5"><span class="hint" data-k="durHint"></span></div>
    <div class="field"><label for="fade" data-k="fade"></label><span class="val" id="fadeV"></span>
      <input id="fade" type="range" min="0" max="5" step="0.1" value="1"><span class="hint" data-k="fadeHint"></span></div>
    <div class="field"><label for="fx" data-k="fxMain"></label><span></span><select id="fx" style="grid-column:1/-1"></select></div>
    <label class="chk"><input type="checkbox" id="loop" checked><span data-k="loop"></span></label>
  </div>
  <details class="card">
    <summary data-k="secMusic"></summary>
    <div class="row" style="margin-bottom:8px"><button id="addMusic" data-k="addM"></button><button id="mToggle" disabled></button><button id="mClear" class="danger" data-k="clearM" disabled></button></div>
    <input id="mfile" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple hidden>
    <div class="tracks" id="tracks"></div>
    <div class="field" style="margin-top:8px"><label for="mvol" data-k="mvol"></label><span class="val" id="mvolV"></span><input id="mvol" type="range" min="0" max="1" step="0.05" value="0.5"></div>
    <label class="chk"><input type="checkbox" id="syncMusic" checked><span data-k="syncM"></span></label>
    <label class="chk"><input type="checkbox" id="mLoop" checked><span data-k="loopM"></span></label>
  </details>
  <details class="card">
    <summary data-k="secVid"></summary>
    <label class="chk"><input type="checkbox" id="vidFull" checked><span data-k="vidFull"></span></label>
    <label class="chk"><input type="checkbox" id="vidSound" checked><span data-k="vidSound"></span></label>
    <label class="chk"><input type="checkbox" id="duck" checked><span data-k="duck"></span></label>
  </details>
  <details class="card">
    <summary data-k="secTts"></summary>
    <label class="chk"><input type="checkbox" id="tts"><span data-k="ttsOn"></span></label>
    <label class="chk"><input type="checkbox" id="waitTts" checked><span data-k="ttsWait"></span></label>
    <div class="field"><label for="rate" data-k="rate"></label><span class="val" id="rateV"></span><input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="1"></div>
    <button id="speakNow" data-k="listen" disabled></button>

function mkSys(ty,W,H){var sc=W/1280,ps=[];for(var i=0;i<(OVC[ty]||0);i++)ps.push(spawn(ty,W,H,sc,true));return{ty:ty,ps:ps,W:W,H:H,sc:sc,t:0}}
function stepSys(g,S,dt){
  var W=S.W,H=S.H,sc=S.sc,ty=S.ty;S.t+=dt;
  for(var i=0;i<S.ps.length;i++){
    var p=S.ps[i];p.ph+=dt*(ty==='sparkle'?2.5:1.6);g.save();
    if(ty==='rain'){
      p.x+=p.vx*dt;p.y+=p.vy*dt;g.strokeStyle='rgba(205,225,255,'+p.a+')';g.lineWidth=1.6*sc;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx/p.vy*p.r,p.y-p.r);g.stroke();
      if(p.y>H||p.x<-30){S.ps[i]=spawn(ty,W,H,sc,false);S.ps[i].x=rnd(0,W*1.15)}
    }else if(ty==='snow'){
      p.x+=(p.vx+Math.sin(p.ph)*18*sc)*dt;p.y+=p.vy*dt;g.fillStyle='rgba(255,255,255,'+p.a+')';g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();
      if(p.y>H+10)S.ps[i]=spawn(ty,W,H,sc,false);
    }else if(ty==='bubbles'){
      p.x+=Math.sin(p.ph)*18*sc*dt;p.y+=p.vy*dt;
      var gr=g.createRadialGradient(p.x-p.r*.3,p.y-p.r*.3,p.r*.1,p.x,p.y,p.r);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(1,'rgba(180,220,255,.08)');
      g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,6.283);g.fill();g.strokeStyle='rgba(255,255,255,'+p.a+')';g.lineWidth=1.8*sc;g.stroke();
      g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.arc(p.x-p.r*.35,p.y-p.r*.35,p.r*.18,0,6.283);g.fill();
      if(p.y<-p.r*2)S.ps[i]=spawn(ty,W,H,sc,false);
    }else if(ty==='sparkle'){
      g.globalAlpha=.5+.5*Math.sin(p.ph);g.fillStyle=p.c;g.translate(p.x,p.y);g.beginPath();
      for(var k=0;k<8;k++){var rr=k%2?p.r*.3:p.r,an=k*Math.PI/4;g.lineTo(Math.cos(an)*rr,Math.sin(an)*rr)}g.closePath();g.fill();
    }else if(ty==='firefly'){
      p.vx+=rnd(-60,60)*dt*sc;p.vy+=rnd(-60,60)*dt*sc;var sp=Math.hypot(p.vx,p.vy),mx=35*sc;if(sp>mx){p.vx*=mx/sp;p.vy*=mx/sp}
      p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      var al=.35+.65*(.5+.5*Math.sin(p.ph)),fg=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);fg.addColorStop(0,'rgba(230,255,120,'+al+')');fg.addColorStop(1,'rgba(230,255,120,0)');
      g.fillStyle=fg;g.beginPath();g.arc(p.x,p.y,p.r*6,0,6.283);g.fill();g.fillStyle='rgba(255,255,210,'+al+')';g.beginPath();g.arc(p.x,p.y,p.r*.6,0,6.283);g.fill();
    }else if(ty==='hearts'){
      p.x+=Math.sin(p.ph)*25*sc*dt;p.y+=p.vy*dt;g.globalAlpha=p.a;g.fillStyle=p.c;var r=p.r;g.beginPath();g.moveTo(p.x,p.y+r*.9);
      g.bezierCurveTo(p.x+r*1.4,p.y-r*.1,p.x+r*.7,p.y-r*1.1,p.x,p.y-r*.35);g.bezierCurveTo(p.x-r*.7,p.y-r*1.1,p.x-r*1.4,p.y-r*.1,p.x,p.y+r*.9);g.fill();
      if(p.y<-r*2)S.ps[i]=spawn(ty,W,H,sc,false);
    }else if(ty==='confetti'){
      p.x+=(p.vx+Math.sin(p.ph)*20*sc)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,Math.cos(p.ph*3));g.fillStyle=p.c;g.fillRect(-p.r,-p.r*.5,p.r*2,p.r);
      if(p.y>H+20)S.ps[i]=spawn(ty,W,H,sc,false);
    }else if(ty==='leaves'){
      p.x+=(p.vx+Math.sin(p.ph)*30*sc)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt*.5;g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.c;g.beginPath();g.ellipse(0,0,p.r,p.r*.5,0,0,6.283);g.fill();
      g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1*sc;g.beginPath();g.moveTo(-p.r,0);g.lineTo(p.r,0);g.stroke();
      if(p.y>H+20)S.ps[i]=spawn(ty,W,H,sc,false);
    }
    g.restore();
  }
}
